<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18233b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LIFE QUEST — 人生攻略RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#1b2945,#0f172a);padding-bottom:82px}.top{padding:22px 18px 10px;text-align:center}.brand{font-weight:800;letter-spacing:2px;font-size:20px}.sub{font-size:12px;opacity:.7;margin-top:4px}.card{margin:12px 16px;padding:16px;border:1px solid #3b4964;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:0 8px 25px #0003}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:22px;font-weight:800}.badge{font-size:12px;opacity:.75}.bar{height:10px;background:#26344e;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#8fb3ff;border-radius:99px;transition:.3s}.row{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}.quest{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff18}.quest:last-child{border:0}.qtitle{font-weight:700}.meta{font-size:12px;opacity:.65;margin-top:3px}.clear{border:0;border-radius:12px;padding:9px 12px;background:#e7edf9;color:#172033;font-weight:800}.clear:disabled{opacity:.35}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border-radius:14px;background:#ffffff09}.stat b{display:block;margin-bottom:7px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#111827ee;border-top:1px solid #334155;padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.nav button{background:none;border:0;color:#cbd5e1;padding:8px 2px;font-size:11px}.nav button.active{color:#fff;font-weight:800}.hidden{display:none}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.region{padding:16px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff12}.region .emoji{font-size:25px}.small{font-size:12px;opacity:.7}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center}.modalbox{width:min(520px,100%);background:#172238;border-radius:24px 24px 0 0;padding:22px}.modal input{width:100%;padding:13px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;margin:12px 0}.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#dbe7ff;color:#172033;font-weight:800}
</style></head>
<body><main class="app"><header class="top"><div class="brand">⚔️ LIFE QUEST</div><div class="sub">人生をゲームとして攻略する</div></header>
<section id="home"><div class="card hero"><div><div class="badge">冒険者</div><div class="name" id="playerName">PLAYER</div><div class="badge">Lv.<span id="level">1</span>　⭐ <span id="xp">0</span> XP　💰 <span id="gold">0</span> G</div></div><div style="font-size:46px">🧭</div></div>
<div class="card"><div class="row"><span>❤️ HP</span><b><span id="hp">100</span>/100</b></div><div class="bar"><div class="fill" id="hpbar" style="width:100%"></div></div></div>
<div class="card"><h3>⚔️ 今日のクエスト</h3><div id="quests"></div></div>
<div class="card"><h3>📊 ステータス</h3><div class="stats" id="stats"></div></div></section>
<section id="map" class="hidden"><div class="card"><h2>🗺️ WORLD MAP</h2><p class="small">6つの能力を育てて、世界を開拓しよう。</p><div class="map" id="regions"></div></div></section>
<section id="settings" class="hidden"><div class="card"><h2>⚙️ SETTINGS</h2><p class="small">冒険者名はこの端末の中だけに保存されます。</p><button class="primary" onclick="openName()">冒険者名を変更</button></div><div class="card"><p class="small">この試作版は個人情報・外部アカウント・位置情報を必要としません。</p></div></section>
<nav class="nav"><button class="active" onclick="show('home',this)">🏰<br>ホーム</button><button onclick="show('home',this);document.getElementById('quests').scrollIntoView()">⚔️<br>クエスト</button><button onclick="show('map',this)">🗺️<br>マップ</button><button onclick="show('settings',this)">⚙️<br>設定</button></nav></main>
<div class="modal hidden" id="modal"><div class="modalbox"><h2>🧙 冒険者登録</h2><p class="small">好きな名前を入力してください。空欄ならPLAYERになります。</p><input id="nameInput" maxlength="20" placeholder="冒険者名"><button class="primary" onclick="saveName()">冒険を始める</button></div></div>
<script>
const KEY='lifequest_save_v1';const regions=[['💪','VITALITY','生命力'],['🏠','ORDER','整頓力'],['📚','WISDOM','知力'],['💰','WEALTH','財力'],['🌎','ADVENTURE','冒険力'],['❤️','BOND','絆']];
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'PLAYER',xp:0,gold:0,hp:100,stats:Object.fromEntries(regions.map(x=>[x[1],0])),done:{}};
const qs=[['water','💧 水をコップ1杯飲む','VITALITY',5],['tidy','🏠 ゴミを5個捨てる','ORDER',10],['english','📚 英語を10分やる','WISDOM',10],['money','💰 支出を1つ確認する','WEALTH',5],['trip','🌎 行きたい場所を1つ調べる','ADVENTURE',10],['bond','❤️ 誰かにメッセージする','BOND',10]];
function level(x){return [0,100,250,450,700,1000,1350,1750,2200,2700].filter(v=>x>=v).length}
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}
function complete(id,stat,xp){if(s.done[id])return;s.done[id]=1;s.xp+=xp;s.gold+=xp;s.stats[stat]+=xp;save()}
function render(){document.getElementById('playerName').textContent=s.name;document.getElementById('xp').textContent=s.xp;document.getElementById('gold').textContent=s.gold;document.getElementById('hp').textContent=s.hp;document.getElementById('hpbar').style.width=s.hp+'%';document.getElementById('level').textContent=level(Math.min(s.xp,2700));document.getElementById('quests').innerHTML=qs.map(q=>`<div class="quest"><div><div class="qtitle">${q[1]}</div><div class="meta">+${q[3]} XP　${q[2]}</div></div><button class="clear" ${s.done[q[0]]?'disabled':''} onclick="complete('${q[0]}','${q[2]}',${q[3]})">${s.done[q[0]]?'CLEAR':'達成！'}</button></div>`).join('');document.getElementById('stats').innerHTML=regions.map(r=>`<div class="stat"><b>${r[0]} ${r[2]}</b><div>Lv.${level(s.stats[r[1]])}</div><div class="bar"><div class="fill" style="width:${Math.min(100,s.stats[r[1]]/27)}%"></div></div></div>`).join('');document.getElementById('regions').innerHTML=regions.map(r=>`<div class="region"><div class="emoji">${r[0]}</div><b>${r[2]}</b><div class="small">${r[1]} · Lv.${level(s.stats[r[1]])}</div></div>`).join('')}
function show(id,btn){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');scrollTo(0,0)}
function openName(){document.getElementById('nameInput').value=s.name==='PLAYER'?'':s.name;document.getElementById('modal').classList.remove('hidden');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function saveName(){s.name=document.getElementById('nameInput').value.trim()||'PLAYER';document.getElementById('modal').classList.add('hidden');save()}
render();if(!localStorage.getItem(KEY))openName();
</script></body></html>
